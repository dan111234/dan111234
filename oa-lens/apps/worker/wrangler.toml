name = "oa-lens"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Comma-separated extension origins allowed by CORS. Empty = any chrome-extension:// origin
# (the shared key still applies). Set by `pnpm ext:key` from apps/extension/extension-key.pub.
[vars]
ALLOWED_ORIGINS = "chrome-extension://alialhhcfbmjkjlbhdmmegejmjhpeiap"

[[d1_databases]]
binding = "DB"
database_name = "oa-lens"
# Paste the database_id printed by `npx wrangler d1 create oa-lens`.
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
# Paste the id printed by `npx wrangler kv namespace create CACHE`.
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Daily cleanup of history rows older than 30 days (docs/07 §5).
[triggers]
crons = ["17 4 * * *"]

[observability]
enabled = true
